<!DOCTYPE html>
<script type="application/json" id="cowork-artifact-meta">
{
  "name": "Morning Task Board",
  "schemaVersion": 1,
  "description": "매일 아침 점검용 할 일 현황판. Notion '작업' 데이터베이스를 실시간으로 읽어 진행 상태별(진행 중/시작 전/완료/보관)로 카드를 그룹핑하고, 기한 초과·오늘 마감을 강조 표시.",
  "mcpTools": [
    "mcp__adae0f67-041b-4883-a5b0-fdb4fd2ab503__notion-search",
    "mcp__adae0f67-041b-4883-a5b0-fdb4fd2ab503__notion-fetch"
  ],
  "mcpServerNames": [
    "Notion",
    "Notion"
  ]
}
</script>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>오늘의 할 일 현황판</title>
<style>
:root { color-scheme: light; }
* { box-sizing: border-box; }
body {
  margin: 0; background: #f7f7f5; color: #1f1f1f;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  font-size: 14px; line-height: 1.5;
}
.wrap { max-width: 1080px; margin: 0 auto; padding: 20px 18px 48px; }
header h1 { font-size: 22px; margin: 0 0 2px; font-weight: 700; }
header .sub { color: #6b6b6b; font-size: 13px; margin-bottom: 18px; }
.summary { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 22px; }
.stat { background: #fff; border: 1px solid #eaeae7; border-radius: 10px; padding: 12px 16px; min-width: 120px; flex: 1 1 120px; }
.stat .n { font-size: 24px; font-weight: 700; }
.stat .l { font-size: 12px; color: #6b6b6b; margin-top: 2px; }
.stat.alert .n { color: #d4392f; }
.stat.today .n { color: #c47d09; }
.cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 14px; }
.col { background: #fff; border: 1px solid #eaeae7; border-radius: 12px; padding: 12px; }
.col h2 { font-size: 13px; margin: 0 0 10px; display: flex; align-items: center; gap: 6px; }
.col h2 .dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
.col h2 .cnt { margin-left: auto; color: #9a9a96; font-weight: 500; }
.card { border: 1px solid #ededea; border-radius: 9px; padding: 10px 11px; margin-bottom: 8px; background: #fcfcfb; }
.card:last-child { margin-bottom: 0; }
.card .t { font-weight: 600; font-size: 13.5px; margin-bottom: 6px; }
.card .t a { color: inherit; text-decoration: none; }
.card .t a:hover { text-decoration: underline; }
.meta { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; }
.badge { font-size: 11px; padding: 2px 7px; border-radius: 20px; font-weight: 600; }
.pri-높음 { background: #fde8e6; color: #c0392b; }
.pri-중간 { background: #fef5e0; color: #a87708; }
.pri-낮음 { background: #e7f4ea; color: #2f7d40; }
.due { font-size: 11.5px; color: #6b6b6b; }
.due.over { color: #d4392f; font-weight: 700; }
.due.today { color: #c47d09; font-weight: 700; }
.tag { font-size: 11px; padding: 2px 7px; border-radius: 5px; background: #f0f0ee; color: #555; }
.empty { color: #b0b0ac; font-size: 12.5px; padding: 6px 2px; }
.loading, .error { padding: 40px 0; text-align: center; color: #6b6b6b; }
.error { color: #c0392b; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>📌 오늘의 할 일 현황판</h1>
    <div class="sub" id="sub">Notion '작업' 데이터베이스를 실시간으로 불러옵니다.</div>
  </header>
  <div class="summary" id="summary"></div>
  <div id="board"><div class="loading">불러오는 중…</div></div>
</div>
<script>
const DS = "collection://1272bf24-d76a-81a3-b768-000bb24d6381";
const SEARCH = "mcp__adae0f67-041b-4883-a5b0-fdb4fd2ab503__notion-search";
const FETCH = "mcp__adae0f67-041b-4883-a5b0-fdb4fd2ab503__notion-fetch";
const TEMPLATE_ID = "1272bf24-d76a-8123-9cf0-c6f99dcc131f"; // 템플릿 안내 페이지 제외
const STATUS_ORDER = ["진행 중", "시작 전", "완료", "보관"];
const STATUS_DOT = { "진행 중": "#3b82f6", "시작 전": "#9ca3af", "완료": "#22c55e", "보관": "#d1d5db" };

// callMcpTool 응답에서 텍스트만 안전하게 뽑아내는 헬퍼
function extractText(res) {
  if (res == null) return "";
  if (typeof res === "string") return res;
  if (Array.isArray(res.content)) return res.content.map(c => (c && c.text) ? c.text : "").join("\n");
  if (typeof res.text === "string") return res.text;
  return JSON.stringify(res);
}

// 날짜 차이 계산 (오늘 기준)
function dayDiff(dateStr) {
  if (!dateStr) return null;
  const d = new Date(dateStr + "T00:00:00");
  const now = new Date(); now.setHours(0,0,0,0);
  return Math.round((d - now) / 86400000);
}
function dueLabel(dateStr, done) {
  if (!dateStr) return { txt: "", cls: "" };
  const diff = dayDiff(dateStr);
  if (done) return { txt: "📅 " + dateStr, cls: "" };
  if (diff < 0) return { txt: "⚠ " + Math.abs(diff) + "일 지남 (" + dateStr + ")", cls: "over" };
  if (diff === 0) return { txt: "🔥 오늘 마감", cls: "today" };
  if (diff === 1) return { txt: "내일 마감", cls: "" };
  return { txt: "D-" + diff + " (" + dateStr + ")", cls: "" };
}

async function load() {
  try {
    const sres = await window.cowork.callMcpTool(SEARCH, {
      query: "작업", query_type: "internal", data_source_url: DS, page_size: 25, max_highlight_length: 0
    });
    const stext = extractText(sres);
    let parsed; try { parsed = JSON.parse(stext); } catch(e) { parsed = null; }
    let rows = (parsed && parsed.results) ? parsed.results : [];
    // 링크 추출 정규식 fallback
    if (!rows.length) {
      const ids = [...stext.matchAll(/"id"\s*:\s*"([0-9a-f-]{36})"/g)].map(m => m[1]);
      rows = ids.map(id => ({ id }));
    }
    rows = rows.filter(r => (r.id || "").replace(/-/g,"") !== TEMPLATE_ID.replace(/-/g,""));

    const tasks = await Promise.all(rows.map(async r => {
      try {
        const f = await window.cowork.callMcpTool(FETCH, { id: r.id });
        const ft = extractText(f);
        const m = ft.match(/<properties>\s*([\s\S]*?)\s*<\/properties>/);
        if (!m) return null;
        const p = JSON.parse(m[1]);
        return {
          title: p["작업"] || r.title || "(제목 없음)",
          status: p["진행 상태"] || "시작 전",
          priority: p["우선순위"] || "",
          due: p["date:마감일:start"] || "",
          tags: Array.isArray(p["태그"]) ? p["태그"] : [],
          url: p["url"] || r.url || ""
        };
      } catch(e) { return null; }
    }));
    render(tasks.filter(Boolean));
  } catch(e) {
    document.getElementById("board").innerHTML =
      '<div class="error">데이터를 불러오지 못했습니다.<br>' + (e && e.message ? e.message : e) + '</div>';
  }
}

function render(tasks) {
  const done = t => t.status === "완료" || t.status === "보관";
  const overdue = tasks.filter(t => !done(t) && t.due && dayDiff(t.due) < 0);
  const todayDue = tasks.filter(t => !done(t) && t.due && dayDiff(t.due) === 0);
  const open = tasks.filter(t => !done(t));

  document.getElementById("summary").innerHTML = [
    { n: tasks.length, l: "전체 작업", c: "" },
    { n: open.length, l: "미완료", c: "" },
    { n: todayDue.length, l: "오늘 마감", c: "today" },
    { n: overdue.length, l: "기한 초과", c: "alert" }
  ].map(s => `<div class="stat ${s.c}"><div class="n">${s.n}</div><div class="l">${s.l}</div></div>`).join("");

  const groups = {};
  STATUS_ORDER.forEach(s => groups[s] = []);
  tasks.forEach(t => { (groups[t.status] = groups[t.status] || []).push(t); });
  // 미완료 컬럼은 마감일 빠른 순 정렬
  ["진행 중","시작 전"].forEach(s => groups[s] && groups[s].sort((a,b) => (a.due||"9999").localeCompare(b.due||"9999")));

  const cols = Object.keys(groups).filter(s => groups[s].length || STATUS_ORDER.includes(s));
  document.getElementById("board").innerHTML = '<div class="cols">' + STATUS_ORDER.map(s => {
    const items = groups[s] || [];
    const cards = items.length ? items.map(t => {
      const dl = dueLabel(t.due, done(t));
      const pri = t.priority ? `<span class="badge pri-${t.priority}">${t.priority}</span>` : "";
      const due = dl.txt ? `<span class="due ${dl.cls}">${dl.txt}</span>` : "";
      const tags = t.tags.map(tg => `<span class="tag">${tg}</span>`).join("");
      const title = t.url ? `<a href="${t.url}" target="_blank">${esc(t.title)}</a>` : esc(t.title);
      return `<div class="card"><div class="t">${title}</div><div class="meta">${pri}${due}${tags}</div></div>`;
    }).join("") : '<div class="empty">없음</div>';
    return `<div class="col"><h2><span class="dot" style="background:${STATUS_DOT[s]}"></span>${s}<span class="cnt">${items.length}</span></h2>${cards}</div>`;
  }).join("") + '</div>';

  const now = new Date();
  document.getElementById("sub").textContent =
    `Notion '작업' DB · 마지막 갱신 ${now.getMonth()+1}월 ${now.getDate()}일 ${String(now.getHours()).padStart(2,"0")}:${String(now.getMinutes()).padStart(2,"0")}`;
}

function esc(s){ return String(s).replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])); }

load();
</script>
</body>
</html>
